[package]
name = "aurora-console"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
aurora-asset = { path = "../aurora-asset" }
directories = "6.0.0"
regex = "1.13.1"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
suppaftp = "12.2.1"
tempfile = "3.27.0"

[dev-dependencies]
image = { version = "0.25", default-features = false }
test-servers = { path = "../../tools/test-servers" }
