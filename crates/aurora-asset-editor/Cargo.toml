[package]
name = "aurora-asset-editor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
arboard = { version = "3.7.0", default-features = false, features = ["wayland-data-control"] }
async-channel = "2.5.0"
aurora-asset = { path = "../aurora-asset" }
aurora-console = { path = "../aurora-console" }
aurora-image = { path = "../aurora-image" }
aurora-online = { path = "../aurora-online" }
aurora-ui = { path = "../aurora-ui" }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
dotnet-number-text = { path = "../dotnet-number-text" }
fastrand = "2.5.0"
log = "0.4.35"
open = "5.4.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
slint = { version = "=1.18.1", default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-winit",
    "renderer-software",
    "software-renderer-systemfonts",
    "accessibility",
    "unstable-winit-030",
    "raw-window-handle-06",
] }
tempfile = "3.27.0"

[build-dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
editor-test-support = { path = "../../tools/editor-test-support" }
i-slint-backend-testing = { version = "=1.18.1", features = ["renderer-software"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
test-servers = { path = "../../tools/test-servers" }
ttf-parser = "0.25.1"
